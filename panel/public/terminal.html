<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>网页终端</title>
  <link rel="stylesheet" href="./xterm.css"><link rel="stylesheet" href="./terminal.css">
</head>
<body>
  <div id="terminal-tools" role="group" aria-label="终端历史滚动">
    <button id="history-program" type="button" aria-pressed="false" title="开启后将翻页操作发送给当前程序">程序翻页</button>
    <button id="history-up" type="button" title="本地回看每次最多 3 行；程序翻页时发送 PageUp">上翻</button><button id="history-down" type="button" title="本地回看每次最多 3 行；程序翻页时发送 PageDown">下翻</button>
    <button id="history-latest" type="button" title="回到底部并保留查找工具与关键词；程序翻页时发送一次 Ctrl+End，保持翻页开关，不发送回车">回到实时</button>
    <button id="history-tools-toggle" type="button" aria-expanded="false" aria-controls="history-tools">查找/复制</button>
    <div id="history-status-row"><span id="history-state" role="status">本地回看：滚动不发送按键</span></div>
    <section id="history-tools" aria-label="历史查找与复制" tabindex="-1" hidden>
      <button id="history-tools-close" class="history-tools-close" type="button" aria-label="收起查找与复制">收起</button>
      <div class="history-tools-content">
      <div class="history-find-row"><input id="history-query" type="search" maxlength="128" placeholder="查找已加载内容" aria-label="查找已加载历史" autocomplete="off" spellcheck="false"><button id="history-find-prev" type="button" aria-label="上一个匹配">上一个</button><button id="history-find-next" type="button" aria-label="下一个匹配">下一个</button></div>
      <div class="history-copy-row"><button id="history-copy-selection" type="button">复制选区</button><button id="history-copy-all" type="button">复制当前快照</button><button id="history-download" type="button">下载当前快照</button><p id="history-find-state" role="status">输入关键词</p></div>
      <p id="history-copy-state" role="status"></p>
      <dialog id="history-copy-manual" aria-labelledby="history-copy-title" aria-describedby="history-copy-help" hidden>
        <div class="history-copy-heading"><h2 id="history-copy-title">手动复制文字</h2><button id="history-copy-dismiss" type="button" aria-label="关闭手动复制">关闭</button></div>
        <p id="history-copy-help">文字已选中，可点击“复制到本机”，或按 Ctrl/Cmd+C、长按复制。</p>
        <textarea id="history-copy-text" readonly inputmode="none" aria-label="手动复制历史文字" rows="12" spellcheck="false"></textarea>
        <div class="history-copy-actions"><button id="history-copy-retry" type="button">复制到本机</button><button id="history-copy-select" type="button">全选文字</button><p id="history-copy-result" role="status">关闭窗口会清空这里的文字。</p></div>
      </dialog>
      </div>
    </section>
  </div>
  <div id="terminal" aria-label="远程文字终端"></div>
  <p id="terminal-status" role="status">正在连接原有终端…</p>
  <script src="./xterm.js"></script><script src="./fit.js"></script><script type="module" src="./terminal.js"></script>
</body>
</html>
