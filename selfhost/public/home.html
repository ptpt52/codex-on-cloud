<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211b">
  <title>节点入口</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="home-view">
    <header class="home-header">
      <a href="/" class="home-brand"><span class="mark small" aria-hidden="true">CN</span>节点中继</a>
      <a id="admin-entry" class="quiet home-admin" href="/admin/">进入管理页面 <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <section class="home-intro" aria-labelledby="home-title">
        <p class="home-eyebrow">你的工作节点，统一入口</p>
        <h1 id="home-title">选择在线节点</h1>
        <p class="muted">进入节点后，使用该节点的账号登录。</p>
      </section>
      <section class="home-nodes" aria-labelledby="nodes-title" aria-busy="true">
        <div class="section-heading">
          <div class="home-list-heading"><h2 id="nodes-title" tabindex="-1">在线节点</h2><span id="node-count" class="status neutral" hidden></span></div>
          <button id="refresh-nodes" class="quiet" type="button">刷新</button>
        </div>
        <p id="home-status" class="muted" role="status">正在获取在线节点…</p>
        <ul id="node-list" class="home-node-list"></ul>
        <div id="home-empty" class="home-empty" hidden><strong>暂无在线节点</strong><p>节点接入并上线后会显示在这里。</p></div>
        <noscript><p class="muted">请启用 JavaScript 查看在线节点。管理员可通过顶部入口进入管理页面。</p></noscript>
      </section>
    </main>
  </div>
  <script type="module" src="/home.js"></script>
</body>
</html>
