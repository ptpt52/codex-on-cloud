name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.2'
  GO_VERSION: '1.26.4'
  GOTOOLCHAIN: local

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned local Workers runtime
        run: npm install --prefix "$RUNNER_TEMP/codex-worker-tools" --no-save --ignore-scripts --no-audit --no-fund wrangler@4.158.0
      - name: Install pinned panel test dependencies
        run: npm ci
      - name: Actual workerd gateway, HTTP, WebSocket and persistent selection
        env:
          WORKER_TOOLS: ${{ runner.temp }}/codex-worker-tools
        run: npm run test:gateway:worker
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prepare reliable Ubuntu package sources
        timeout-minutes: 3
        run: sudo --preserve-env=GITHUB_ACTIONS python3 .github/scripts/prepare-apt.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux python3 util-linux
      - run: npm ci --omit=dev --omit=optional
      - run: npm run test:terminal-only
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/forward/go.sum
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:desktop
      - name: Validate the workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 .github/workflows/check.yml
      - name: Go checks
        working-directory: client/forward
        run: |
          go test -race ./...
          go vet ./...
          go mod verify

  selfhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/forward/go.sum
      - name: Prepare reliable Ubuntu package sources
        timeout-minutes: 3
        run: sudo --preserve-env=GITHUB_ACTIONS python3 .github/scripts/prepare-apt.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends caddy=2.6.2-6ubuntu0.24.04.3 coturn=4.6.1-1build4 iproute2 nftables
      - run: npm ci
      - run: npm run test:selfhost:edge
      - run: npm run test:turn
      - name: Actual isolated Linux NAT with Chrome and Go helpers
        run: NAT_TEST_REQUIRED=1 NAT_TEST_ROOT=1 npm run test:rtc:nat
      - run: npm run test:forward:entry

  browsers:
    name: browsers (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - target: chromium-desktop
            engine: chromium
            projects: --project=chromium-desktop
          - target: chromium-phone
            engine: chromium
            projects: --project=chromium-phone
          - target: chromium-tablet
            engine: chromium
            projects: --project=chromium-tablet
          - target: firefox
            engine: firefox
            projects: --project=firefox-desktop
          - target: webkit-desktop
            engine: webkit
            projects: --project=webkit-desktop
          - target: webkit-phone
            engine: webkit
            projects: --project=webkit-phone
          - target: webkit-tablet
            engine: webkit
            projects: --project=webkit-tablet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare reliable Ubuntu package sources
        timeout-minutes: 3
        run: sudo --preserve-env=GITHUB_ACTIONS python3 .github/scripts/prepare-apt.py
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        timeout-minutes: 20
      - name: Cross-browser compatibility
        timeout-minutes: 20
        run: npm run test:compat -- ${{ matrix.projects }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() && (failure() || cancelled()) }}
        timeout-minutes: 3
        with:
          name: browser-failures-${{ matrix.target }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  chromium-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prepare reliable Ubuntu package sources
        timeout-minutes: 3
        run: sudo --preserve-env=GITHUB_ACTIONS python3 .github/scripts/prepare-apt.py
      - run: npx playwright install --with-deps chromium
      - name: Full Chromium regression
        timeout-minutes: 35
        run: npm run test:browser -- --workers=2 --trace=retain-on-failure
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() && (failure() || cancelled()) }}
        timeout-minutes: 3
        with:
          name: browser-failures-chromium-full
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/forward/go.sum
      - name: Prepare reliable Ubuntu package sources
        timeout-minutes: 3
        run: sudo --preserve-env=GITHUB_ACTIONS python3 .github/scripts/prepare-apt.py
      - name: Isolated desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11vnc xfwm4 xfdesktop4 xfce4-panel xfce4-settings xterm tmux xclip xdotool xauth x11-utils x11-xserver-utils dbus-x11 fonts-noto-cjk fonts-dejavu-core imagemagick python3-pil
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select the pinned Playwright browser
        run: node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log("CHROME_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm run test:lifecycle
      - run: npm run test:supervision
      - run: npm run test:display
      - run: npm run test:viewport
      - name: Delay the initial framebuffer before resizing
        run: npm run test:browser -- test/browser/viewport-frame.spec.mjs
      - run: npm run test:pointer
      - run: npm run test:forward
      - run: npm run test:forward:agents
      - run: npm run test:serial
      - run: npm run test:forward:publication
